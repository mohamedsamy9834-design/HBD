<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد يا أحلى أخ OMAR 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 25px 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            z-index: 10;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        /* العنوان الرئيسي */
        h1 {
            font-size: 2.2rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* رسالة التهنئة */
        .message-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            padding: 20px;
            margin: 15px 0;
            border-right: 5px solid #ff416c;
            border-left: 5px solid #8a2be2;
        }

        .message-box p {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #fff;
            font-weight: bold;
        }

        .from-text {
            color: #ff416c;
            font-size: 1.5rem;
            margin-top: 10px;
            display: block;
            text-shadow: 0 0 8px rgba(255, 65, 108, 0.5);
        }

        /* عرض الفيديو */
        .media-box {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: #000;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        video {
            width: 100%;
            max-height: 400px;
            display: block;
            border-radius: 18px;
        }

        /* مشغل الصوت */
        .music-section {
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
        }

        .music-section h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #00f2fe;
        }

        audio {
            width: 100%;
        }

        /* قسم أزرار المفاجآت التفاعلية */
        .interactive-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .btn-surprise {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.3s ease;
        }

        .btn-surprise:active {
            transform: scale(0.95);
        }

        /* قسم الذكريات والعبارات */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* الألعاب النارية والبلونات */
        .fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-emoji {
            position: fixed;
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas class="fireworks-canvas" id="fireworks"></canvas>

    <div class="container">
        <h1>🎉 Happy Birthday OMAR 🎉</h1>
        
        <!-- رسالة التهنئة -->
        <div class="message-box">
            <p>Kol Sana Went A5oya w Sa7by w 7abiby H.B.D OMAR ♥️😍</p>
            <span class="from-text">From HAMADA 🫂♥️</span>
        </div>

        <!-- أزرار تفاعلية -->
        <div class="interactive-section">
            <button class="btn-surprise" onclick="triggerExtraFireworks()">✨4/11/2008✨</button>
        </div>

        <!-- عرض الفيديو الخاص بكما -->
        <div class="media-box">
            <video controls autoplay loop playsinline src="video.mp4.MOV">
                متصفحك لا يدعم عرض الفيديو.
            </video>
        </div>

        <!-- الأغنية -->
        <div class="music-section">
            <h3>🎵 أغنية الاحتفال (من قلب الأسطى قريب)</h3>
            <audio id="audioPlayer" controls autoplay loop src="audio.mp3.mp3">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
        </div>

        <!-- كروت التهنئة والذكريات -->
        <div class="cards-grid">
            <div class="card">♥️ هو يعم الي كمل الي ١٨ سنه</div>
            <div class="card">😂😂 م ب س ب ص</div>
            <div class="card">♥️🧁 سنه حلوه يا مورررريييي</div>
            <div class="card">♥️🫂HAMADA</div>
        </div>
    </div>

    <script>
        // تأثير الألعاب النارية
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        function createFirework(x, y) {
            const fireworkX = x || Math.random() * canvas.width;
            const fireworkY = y || Math.random() * (canvas.height / 2);
            const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: fireworkX,
                    y: fireworkY,
                    angle: Math.random() * Math.PI * 2,
                    speed: Math.random() * 4 + 1,
                    radius: 3,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(15, 12, 41, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += Math.cos(p.angle) * p.speed;
                p.y += Math.sin(p.angle) * p.speed;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(animate);
        }

        setInterval(() => createFirework(), 700);
        animate();

        // مفاجأة الألعاب النارية الإضافية
        function triggerExtraFireworks() {
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.6);
                }, i * 150);
            }
            spawnFloatingEmoji();
        }

        // تأثير تساقط القلوب والبلونات
        function spawnFloatingEmoji() {
            const emojis = ['🎈', '🎉', '♥️', '🎂', '👑'];
            for(let i = 0; i < 10; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'floating-emoji';
                emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = Math.random() * 90 + 'vw';
                emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 4000);
            }
        }

        setInterval(spawnFloatingEmoji, 2500);
    </script>
</body>
</html>
